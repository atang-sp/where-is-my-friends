    announcement:
      title: "Local Friends — Trouvez des personnes près de vous en un clic"
      body: |
        **Local Friends** vous aide à découvrir les membres du forum de votre ville et des environs.

        **Comment ça marche :**
        1. Définissez votre ville (pas de GPS nécessaire, pas de localisation précise partagée)
        2. Voyez instantanément tous ceux qui se trouvent à proximité
        3. Envoyez-leur un message ou organisez des rencontres

        Actuellement **%{count} membres** dans **%{city_count} villes** y participent déjà.

        :point_right: **[Rejoignez Local Friends maintenant](%{link})** — ça prend 10 secondes.

        Votre ville est la seule chose montrée aux autres membres. La confidentialité d'abord, toujours.
      category_title: "Utilisez Local Friends pour trouver des personnes dans votre ville"
      category_body: |
        Vous cherchez quelqu'un à proximité ? Au lieu de publier à chaque fois, essayez **Local Friends** — définissez votre ville une fois et voyez tous les membres à proximité instantanément.

        **%{count} membres** dans **%{city_count} villes** l'utilisent déjà.

        :point_right: **[Rejoignez maintenant](%{link})** — un clic, visible pour toujours par les membres à proximité.

        Vous préférez toujours publier ici ? Totalement bien ! Mais Local Friends vous donne un annuaire permanent qui est toujours à jour.
    notification:
      member_joined_description: "a également rejoint la découverte locale à %{city}"
      profile_location_invite: "Votre profil indique que vous êtes à %{city} — saviez-vous que %{count} membres du forum sont à proximité ? Rejoignez Local Friends pour vous connecter avec eux !"
