    announcement:
      title: "Local Friends — Finden Sie Leute in Ihrer Nähe mit einem Klick"
      body: |
        **Local Friends** hilft Ihnen, Forumsmitglieder in Ihrer Stadt und der näheren Umgebung zu entdecken.

        **Wie es funktioniert:**
        1. Legen Sie Ihre Stadt fest (kein GPS erforderlich, keine genauen Standortangaben werden geteilt)
        2. Sehen Sie sofort alle in der Nähe
        3. Schreiben Sie ihnen Nachrichten oder vereinbaren Sie Treffen

        Derzeit nehmen bereits **%{count} Mitglieder** in **%{city_count} Städten** teil.

        :point_right: **[Jetzt bei Local Friends mitmachen](%{link})** — dauert 10 Sekunden.

        Ihre Stadt ist das Einzige, was anderen Mitgliedern angezeigt wird. Datenschutz geht vor.
      category_title: "Nutzen Sie Local Friends, um Leute in Ihrer Stadt zu finden"
      category_body: |
        Suchen Sie jemanden in Ihrer Nähe? Anstatt jedes Mal zu posten, versuchen Sie **Local Friends** — legen Sie Ihre Stadt einmal fest und sehen Sie sofort alle Mitglieder in der Nähe.

        **%{count} Mitglieder** in **%{city_count} Städten** nutzen es bereits.

        :point_right: **[Jetzt beitreten](%{link})** — ein Klick, dauerhaft sichtbar für Mitglieder in der Nähe.

        Möchten Sie trotzdem lieber hier posten? Völlig in Ordnung! Aber Local Friends bietet Ihnen ein permanentes Verzeichnis, das immer auf dem neuesten Stand ist.
    notification:
      member_joined_description: "ist ebenfalls der lokalen Suche in %{city} beigetreten"
      profile_location_invite: "Ihr Profil zeigt an, dass Sie sich in %{city} befinden — wussten Sie, dass %{count} Forumsmitglieder in der Nähe sind? Treten Sie Local Friends bei, um sich mit ihnen zu verbinden!"
