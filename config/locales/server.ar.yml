    announcement:
      title: "الأصدقاء المحليون — ابحث عن أشخاص بالقرب منك بنقرة واحدة"
      body: |
        **الأصدقاء المحليون** يساعدك على اكتشاف أعضاء المنتدى في مدينتك والمناطق القريبة.

        **كيف يعمل:**
        1. حدد مدينتك (لا حاجة لنظام GPS، ولا تتم مشاركة الموقع الدقيق)
        2. شاهد الجميع في الجوار على الفور
        3. راسلهم أو رتب لقاءات

        حاليًا **%{count} عضو** عبر **%{city_count} مدينة** يشاركون بالفعل.

        :point_right: **[انضم إلى الأصدقاء المحليين الآن](%{link})** — يستغرق الأمر 10 ثوانٍ.

        مدينتك هي الشيء الوحيد الذي يظهر للأعضاء الآخرين. الخصوصية أولاً دائمًا.
      category_title: "استخدم الأصدقاء المحليين للعثور على أشخاص في مدينتك"
      category_body: |
        هل تبحث عن شخص قريب؟ بدلاً من النشر في كل مرة، جرب **الأصدقاء المحليين** — حدد مدينتك مرة واحدة وشاهد جميع الأعضاء القريبين منك على الفور.

        **%{count} عضو** في **%{city_count} مدينة** يستخدمونه بالفعل.

        :point_right: **[انضم الآن](%{link})** — بنقرة واحدة، مرئي للأعضاء القريبين دائمًا.

        هل ما زلت تفضل النشر هنا؟ لا بأس بذلك! لكن الأصدقاء المحليين يمنحك دليلاً دائماً مُحدّثاً باستمرار.
    notification:
