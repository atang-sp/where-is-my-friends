      title: "Local Friends — Найдите людей рядом с вами в один клик"
      body: |
        **Local Friends** помогает вам находить участников форума в вашем городе и близлежащих районах.

        **Как это работает:**
        1. Установите свой город (GPS не требуется, точное местоположение не разглашается)
        2. Мгновенно смотрите всех, кто находится поблизости
        3. Напишите им сообщение или организуйте встречи

        В настоящее время **%{count} участников** в **%{city_count} городах** уже участвуют.

        :point_right: **[Присоединяйтесь к Local Friends сейчас](%{link})** — это займет 10 секунд.

        Ваш город — это единственное, что показывается другим участникам. Конфиденциальность всегда на первом месте.
      category_title: "Используйте Local Friends, чтобы найти людей в вашем городе"
      category_body: |
        Ищете кого-то поблизости? Вместо того чтобы публиковать сообщения каждый раз, попробуйте **Local Friends** — установите свой город один раз и мгновенно смотрите всех участников поблизости.

        **%{count} участников** в **%{city_count} городах** уже используют это.

        :point_right: **[Присоединяйтесь сейчас](%{link})** — один клик, и вы навсегда видимы для участников поблизости.

        Всё еще предпочитаете публиковать сообщения здесь? Вполне нормально! Но Local Friends дает вам постоянный каталог, который всегда актуален.
