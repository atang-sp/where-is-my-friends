    announcement:
      title: "Local Friends — Encontre pessoas perto de você em um clique"
      body: |
        **Local Friends** ajuda você a descobrir membros do fórum em sua cidade e áreas próximas.

        **Como funciona:**
        1. Defina sua cidade (sem necessidade de GPS, nenhuma localização precisa compartilhada)
        2. Veja instantaneamente todos por perto
        3. Envie mensagens ou marque encontros

        Atualmente **%{count} membros** em **%{city_count} cidades** já estão participando.

        :point_right: **[Junte-se ao Local Friends agora](%{link})** — leva 10 segundos.

        Sua cidade é a única coisa mostrada a outros membros. Privacidade em primeiro lugar, sempre.
      category_title: "Use o Local Friends para encontrar pessoas em sua cidade"
      category_body: |
        Procurando por alguém por perto? Em vez de postar todas as vezes, tente o **Local Friends** — defina sua cidade uma vez e veja todos os membros próximos instantaneamente.

        **%{count} membros** em **%{city_count} cidades** já o estão utilizando.

        :point_right: **[Junte-se agora](%{link})** — um clique, visível para sempre aos membros próximos.

        Ainda prefere postar aqui? Tudo bem! Mas o Local Friends oferece um diretório permanente que está sempre atualizado.
