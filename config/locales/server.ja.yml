    announcement:
      title: "ご近所の友達 —— 近くのメンバーをワンクリックで見つけよう"
      body: |
        **ご近所の友達** は、フォーラム内で同じ都市や近くにいるメンバーを見つけるお手伝いをします。

        **使い方：**
        1. あなたの都市を入力します（GPS不要、正確な位置情報や身バレの心配はありません）。
        2. すぐに近くにいるメンバー全員が表示されます。
        3. メッセージを送ったり、お茶（顔合わせ）に誘ったりしましょう。安全第一でご交流ください。

        現在、すでに **%{count} 人のメンバー** が **%{city_count} の都市** でこの機能を利用しています。

        :point_right: **[今すぐ参加する](%{link})** —— わずか10秒で完了します。

        他のメンバーには都市名のみが表示され、プライバシー保護（身バレ防止）が最優先されています。
      category_title: "「ご近所の友達」で近くのメンバーをワンクリックで確認"
      category_body: |
        近くのメンバーを探していますか？毎回投稿する必要はありません。**ご近所の友達** を試して、一度都市を設定するだけで、いつでも近くのすべてのメンバーを確認できます。

        すでに **%{count} 人** が **%{city_count} の都市** で利用しています。

        :point_right: **[今すぐ参加する](%{link})** —— 一度設定すれば、ずっと表示されます。

        もちろん、ここで引き続きメンバー募集の投稿をすることも可能です。しかし、「ご近所の友達」を使えば、常にオンラインのローカルディレクトリを手に入れることができます。
