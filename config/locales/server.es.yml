    announcement:
      title: "Local Friends — Encuentra personas cerca de ti en un clic"
      body: |
        **Local Friends** te ayuda a descubrir miembros del foro en tu ciudad y áreas cercanas.

        **Cómo funciona:**
        1. Establece tu ciudad (sin necesidad de GPS, no se comparte ubicación precisa)
        2. Ve instantáneamente a todos los que están cerca
        3. Envíales mensajes u organiza encuentros

        Actualmente **%{count} miembros** en **%{city_count} ciudades** ya están participando.

        :point_right: **[Únete a Local Friends ahora](%{link})** — tarda 10 segundos.

        Tu ciudad es lo único que se muestra a otros miembros. Privacidad ante todo, siempre.
      category_title: "Usa Local Friends para encontrar personas en tu ciudad"
      category_body: |
        ¿Buscas a alguien cerca? En lugar de publicar cada vez, prueba **Local Friends** — establece tu ciudad una vez y ve a todos los miembros cercanos al instante.

        **%{count} miembros** en **%{city_count} ciudades** ya lo están usando.

        :point_right: **[Únete ahora](%{link})** — un clic, visible para siempre para los miembros cercanos.

        ¿Aún prefieres publicar aquí? ¡Totalmente bien! Pero Local Friends te da un directorio permanente que siempre está actualizado.
    notification:
      member_joined_description: "también se unió al descubrimiento local en %{city}"
      profile_location_invite: "Tu perfil indica que estás en %{city} — ¿sabías que %{count} miembros del foro están cerca? ¡Únete a Local Friends para conectar con ellos!"
      profile_location_invite_suppressed: "Tu perfil indica que estás en %{city} — los miembros del foro cercanos se han unido a Local Friends. ¡Únete para conectar con ellos!"
