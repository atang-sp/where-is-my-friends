      profile_location_invite: "Your profile shows you're in %{city} — did you know %{count} forum members are nearby? Join Local Friends to connect with them!"
      profile_location_invite_suppressed: "Your profile shows you're in %{city} — forum members nearby have joined Local Friends. Join to connect with them!"
      profile_location_invite_empty: "Your profile shows you're in %{city}. Join Local Friends to help people nearby find one another!"
