plugins:
  where_is_my_friends_enabled:
    default: true
    client: true
    type: bool
    description: "启用附近的朋友插件"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_interest_onboarding_enabled:
    default: true
    client: true
    type: bool
    description: "启用兴趣冷启动和个性化成员推荐"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_interest_tags:
    default: ""
    type: list
    list_type: simple
    description: "在插件内置细分兴趣目录之外补充的论坛标签，最多20个"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_practice_invitations_enabled:
    default: true
    client: true
    type: bool
    description: "启用严格一对一实践邀请"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_practice_invitation_min_trust_level:
    default: 1
    min: 0
    max: 4
    type: integer
    description: "允许发送实践邀请的最低信任等级"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_practice_invitation_daily_limit:
    default: 5
    min: 1
    max: 50
    type: integer
    description: "每位成员每天最多发送的实践邀请数"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_enable_virtual_location:
    default: true
    client: true
    type: bool
    description: "启用虚拟定位功能，允许用户在地图上选择位置"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_map_provider:
    default: "openstreetmap"
    client: true
    type: enum
    choices:
      - amap
      - baidu
      - openstreetmap
    description: "地图服务提供商 (amap: 高德地图, baidu: 百度地图, openstreetmap: 开源地图)"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_amap_api_key:
    default: ""
    type: string
    description: "高德地图浏览器API密钥（必须限制到论坛域名）"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_baidu_api_key:
    default: ""
    type: string
    description: "百度地图浏览器API密钥（必须限制到论坛域名）"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_max_users_display:
    default: 50
    min: 10
    max: 200
    client: true
    type: integer
    description: "附近用户列表的最大显示数量"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_aggregate_privacy_threshold:
    default: 3
    min: 2
    max: 20
    type: integer
    description: "显示精确活跃人数所需的最少用户数"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_seed_cities:
    default: ""
    type: string
    description: "推荐城市列表，用竖线分隔（如 上海|北京|深圳|New York|Tokyo）"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_default_discovery_radius_km:
    default: 100
    min: 20
    max: 500
    client: true
    type: integer
    description: "默认发现半径（公里）。用户可在 50/100/200 中自选。"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_target_category_slug:
    default: ""
    client: true
    type: string
    description: "同城相关分区的 slug（如 local-meetup）。在此分区中显示更强的引导组件。"
    category: "where_is_my_friends"
    translated: true

  where_is_my_friends_filterable_user_fields:
    default: "性别|属性"
    type: list
    list_type: simple
    description: "允许在发现结果中筛选的 Discourse 自定义用户字段名称（仅限下拉类型），用竖线分隔"
    category: "where_is_my_friends"
    translated: true

  licensed_import_enabled:
    default: false
    type: bool
    description: "启用有明确许可的英文精选翻译任务"
    category: "where_is_my_friends"
    translated: true

  licensed_import_dry_run:
    default: true
    type: bool
    description: "只生成管理员预览，不创建公开主题"
    category: "where_is_my_friends"
    translated: true

  licensed_import_interval_hours:
    default: 24
    min: 24
    max: 720
    type: integer
    description: "两次英文精选任务之间的最短小时数"
    category: "where_is_my_friends"
    translated: true

  licensed_import_publish_hour:
    default: 20
    min: 0
    max: 23
    type: integer
    description: "英文精选任务的北京时间发布小时"
    category: "where_is_my_friends"
    translated: true

  licensed_import_model:
    default: "gpt-5.6-terra"
    type: enum
    choices:
      - gpt-5.6-terra
    description: "英文精选翻译与复核使用的固定 OpenAI 模型"
    category: "where_is_my_friends"
    translated: true

  licensed_import_monthly_token_budget:
    default: 1500000
    min: 10000
    max: 100000000
    type: integer
    description: "英文精选每月最多使用的生成 token 总量"
    category: "where_is_my_friends"
    translated: true

  licensed_import_max_per_day:
    default: 1
    min: 1
    max: 1
    type: integer
    description: "每天最多创建的英文精选数量（固定为 1）"
    category: "where_is_my_friends"
    translated: true
